<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Meet your ancestors — grounded in the record</title>
<meta name="description" content="Drop your family tree (a GEDCOM) and meet your ancestors as they were — each knowing only what their own lifetime and record allow. Nothing invented. Your file never leaves your browser." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23000'/><path d='M69.15 33.92 A25 25 0 1 0 69.15 66.08' fill='none' stroke='%23fff' stroke-width='17'/></svg>" />
<script src="/assets/vendor/react-18.3.1.production.min.js"></script>
<script src="/assets/vendor/react-dom-18.3.1.production.min.js"></script>

<style>
  :root{
    --bg:#efece4; --surface:#f7f4ed; --raise:#fbf9f4; --ink:#221f19; --body:#433d33;
    --muted:#726757; --faint:#938673; --line:#ddd6c8; --line-strong:#c8bfad;
    --pine:#2d5a4a; --rust:#9a4a2d; --gold:#8f7222; --good:#3f7a5f;
    --pine-wash:rgba(45,90,74,.09); --rust-wash:rgba(154,74,45,.08);
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    --mono:"SFMono-Regular",ui-monospace,Consolas,"Liberation Mono",monospace;
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#141109; --surface:#1c1810; --raise:#221d14; --ink:#efe7d6; --body:#d3c9b6;
      --muted:#9d917d; --faint:#7d7261; --line:#322b20; --line-strong:#463d2d;
      --pine:#79b79c; --rust:#dc8a62; --gold:#cbab5f; --good:#7cc0a0;
      --pine-wash:rgba(121,183,156,.10); --rust-wash:rgba(220,138,98,.10); }
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--body);font-family:var(--sans);line-height:1.55;
    -webkit-font-smoothing:antialiased;background-image:radial-gradient(circle at 15% -10%,var(--pine-wash),transparent 45%)}
  .wrap{max-width:1120px;margin:0 auto;padding:0 22px}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--rust);font-weight:600}
  h1{font-family:var(--serif);font-weight:600;color:var(--ink);line-height:1.03;letter-spacing:-.01em;margin:14px 0 0;text-wrap:balance}
  .lead{color:var(--muted);max-width:58ch}
  .btn{font-family:var(--sans);font-weight:600;font-size:14px;padding:10px 18px;border-radius:6px;border:1px solid var(--pine);
    background:var(--pine);color:#fff;cursor:pointer;transition:filter .15s}
  .btn:hover{filter:brightness(1.08)}
  .btn.ghost{background:transparent;color:var(--pine);border-color:var(--line-strong)}
  .btn.sm{font-size:12.5px;padding:6px 12px}
  .mono{font-family:var(--mono)}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:10px}
  a{color:var(--pine)}
  input[type=text]{font-family:var(--sans);padding:9px 12px;border-radius:6px;border:1px solid var(--line-strong);background:var(--raise);color:var(--ink);font-size:14px}
  ::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:6px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="root"></div>

<!-- the governed engine — no data.js; everything is built from the imported GEDCOM -->
<script src="/ui_kits/living-line/gedcom-import.js"></script>
<script src="/ui_kits/living-line/memory-graph.js"></script>
<script src="/ui_kits/living-line/personas.js"></script>
<script src="/ui_kits/living-line/encounters.js"></script>
<script src="/ui_kits/living-line/ai-client.js"></script>
<script src="/ui_kits/living-line/llm-byok.js"></script>
<script src="/ui_kits/living-line/family-store.js"></script>
<!-- real records: search the Library of Congress newspaper archive (via /api/records) -->
<script src="/ui_kits/living-line/record-connectors.js"></script>
<!-- optional account sync: sign in to save your tree across devices (DB-as-record) -->
<script src="/ui_kits/living-line/supabase-config.js"></script>
<script src="/ui_kits/living-line/auth.js"></script>
<script src="/ui_kits/living-line/family-cloud.js"></script>

<script src="/ui_kits/onboarding/index.boot.js"></script>
</body>
</html>
